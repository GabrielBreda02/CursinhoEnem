<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrigir Redação</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>
    <div id="navbar"></div>

    <div class="container container-estreito">
        <h1 class="titulo">Corrigir Redação</h1>
        <p id="alunoInfo" class="subtitulo">Carregando...</p>

        <p id="temaRedacaoTitulo" class="titulo-tabela"></p>
        <p id="temaRedacaoTexto" style="white-space:pre-wrap;margin:12px 0;"></p>

        <p class="titulo-tabela">Redação do aluno</p>
        <p id="textoRedacao" style="white-space:pre-wrap;background:var(--bg);padding:16px;border-radius:var(--radius-sm);"></p>

        <form id="formCorrecao" style="margin-top:24px;">
            <p class="titulo-tabela">Competências (0 a 200 cada, em múltiplos de 20 — como no ENEM)</p>
            <div class="row">
                <div class="campo">
                    <label>C1 — Domínio da norma culta</label>
                    <input type="number" id="notaComp1" min="0" max="200" step="20" placeholder="Ex.: 160">
                </div>
                <div class="campo">
                    <label>C2 — Compreensão do tema</label>
                    <input type="number" id="notaComp2" min="0" max="200" step="20" placeholder="Ex.: 160">
                </div>
            </div>
            <div class="row">
                <div class="campo">
                    <label>C3 — Argumentação</label>
                    <input type="number" id="notaComp3" min="0" max="200" step="20" placeholder="Ex.: 160">
                </div>
                <div class="campo">
                    <label>C4 — Coesão textual</label>
                    <input type="number" id="notaComp4" min="0" max="200" step="20" placeholder="Ex.: 160">
                </div>
            </div>
            <div class="campo">
                <label>C5 — Proposta de intervenção</label>
                <input type="number" id="notaComp5" min="0" max="200" step="20" placeholder="Ex.: 160">
            </div>
            <p id="notaTotalPreview" style="font-weight:700;margin-top:4px;"></p>
            <div class="campo">
                <label>Comentário para o aluno</label>
                <textarea id="comentarioRedacao" placeholder="Feedback sobre a redação..." style="min-height:150px;"></textarea>
            </div>
            <div class="acoes">
                <button type="button" onclick="salvarCorrecao()" class="btn">Salvar Correção</button>
                <button type="button" onclick="window.location.href='Redacoes.html'" class="btn btn-ghost">Voltar</button>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
    <script src="CorrigirRedacao.js"></script>
</body>

</html>
