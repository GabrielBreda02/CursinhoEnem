<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Questão</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="Estilo.css">
</head>

<body>
  <div id="navbar"></div>

  <div class="container">
    <h1 id="tituloPagina" class="titulo">Nova Questão</h1>

    <form id="formQuestao">

      <div class="campo">
        <label>Área de conhecimento (ENEM)</label>
        <select id="area">
          <option value="Linguagens, Códigos e suas Tecnologias">Linguagens, Códigos e suas Tecnologias</option>
          <option value="Ciências Humanas e suas Tecnologias">Ciências Humanas e suas Tecnologias</option>
          <option value="Ciências da Natureza e suas Tecnologias">Ciências da Natureza e suas Tecnologias</option>
          <option value="Matemática e suas Tecnologias">Matemática e suas Tecnologias</option>
        </select>
      </div>

      <div class="campo">
        <label>Disciplina ( sem abreviação)</label>
        <input type="text" id="disciplina" placeholder="Ex.: Programação Web">
      </div>

      <div class="campo">
        <label>Assuntos (separados por vírgula)</label>
        <input type="text" id="assuntos" placeholder="Ex.: HTML, CSS, JavaScript">
      </div>

      <div class="row">
        <div class="campo">
          <label>Ano do ENEM (se a questão vier de uma prova real)</label>
          <input type="number" id="ano" placeholder="Ex.: 2019">
        </div>
        <div class="campo">
          <label>Fonte</label>
          <input type="text" id="fonte" placeholder="Ex.: ENEM 2019 ou Autoral">
        </div>
      </div>

      <div class="campo">
        <label>Título ( enunciado ) </label>
        <textarea id="titulo" placeholder="Digite o enunciado completo da questão..."></textarea>
      </div>

      <div class="campo">
        <label>Imagem do enunciado (opcional — gráfico, tirinha, mapa etc.)</label>
        <input type="file" id="imagemArquivo" accept=".jpg,.jpeg,.png,.webp">
        <p id="imagemStatus" style="margin-top:8px;"></p>
        <img id="imagemPreview" style="display:none;max-width:100%;border-radius:8px;margin-top:8px;">
      </div>

      <div class="campo">
        <label>Alternativas</label>

        <div class="alternativas" id="alternativa">
        </div>

      </div>

      <div class="acoes">
        <button type="button" onclick="salvarQuestao()" class="btn">Salvar</button>
        <button type="button" onclick="window.location.href='questoes.html'" class="btn btn-ghost">Cancelar</button>
      </div>

    </form>
  </div>

  <script src="auth.js"></script>
  <script src="Questao.js"></script>
</body>

</html>
