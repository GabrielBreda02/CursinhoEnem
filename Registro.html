<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="Estilo.css">
</head>

<body>

  <div class="container">
    <h1 class="titulo">Criar Conta</h1>

    <p id="mensagemErro" class="mensagem-erro" style="display:none;"></p>

    <form id="formRegistro">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="text" id="email" placeholder="seu@email.com" autocomplete="username">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
      </div>

      <div class="acoes">
        <button type="button" onclick="registrar()" class="btn">Cadastrar</button>
      </div>
    </form>

    <p style="margin-top:16px;">
      Já tem conta? <a href="Login.html">Entrar</a>
    </p>
  </div>

  <script src="auth.js"></script>
  <script src="Registro.js"></script>
</body>

</html>
