<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="Estilo.css">
</head>

<body>
  <div id="navbar"></div>

  <div class="container container-estreito">
    <h1 class="titulo">Criar Conta</h1>
    <p class="subtitulo">Leva menos de um minuto para começar.</p>

    <p id="mensagemErro" class="mensagem-erro" style="display:none;"></p>

    <form id="formRegistro">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="text" id="email" placeholder="seu@email.com" autocomplete="username">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
      </div>

      <div class="campo">
        <label>Eu sou</label>
        <div class="opcao-tipo">
          <label for="tipoAluno">
            <input type="radio" name="tipo" id="tipoAluno" value="Aluno" checked>
            <span>Aluno — quero fazer simulados</span>
          </label>
          <label for="tipoProfessor">
            <input type="radio" name="tipo" id="tipoProfessor" value="Professor">
            <span>Professor — quero cadastrar questões e provas</span>
          </label>
        </div>
      </div>

      <div class="acoes">
        <button type="button" onclick="registrar()" class="btn">Cadastrar</button>
      </div>
    </form>

    <p style="margin-top:16px;">
      Já tem conta? <a href="Login.html">Entrar</a>
    </p>
  </div>

  <script src="auth.js"></script>
  <script src="Registro.js"></script>
</body>

</html>
