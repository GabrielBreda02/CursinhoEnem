<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CursinhoEnem</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="Estilo.css" />
</head>

<body>
  <div id="navbar"></div>

  <div class="container">
    <h1 class="titulo">CursinhoEnem</h1>
    <p id="subtitulo" class="subtitulo">Simulados de ENEM com tempo cronometrado e redação, do jeito que cai na prova.</p>

    <div id="menuPrincipal" class="menu-grid"></div>
  </div>

  <script src="auth.js"></script>
  <script>
    const menuPrincipal = document.getElementById("menuPrincipal");
    const subtitulo = document.getElementById("subtitulo");

    if (ehProfessor()) {
      subtitulo.textContent = "Monte seu banco de questões, temas de redação e provas para os alunos.";
      menuPrincipal.innerHTML = `
        <a href="Questoes.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Cadastrar Questões</strong>
          <span>Monte o banco de questões por área do ENEM</span>
        </a>
        <a href="Provas.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Gerar Provas</strong>
          <span>Combine questões, tempo limite e redação</span>
        </a>
        <a href="TemasRedacao.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Temas de Redação</strong>
          <span>Cadastre temas e textos motivadores</span>
        </a>
      `;
    } else if (ehAluno()) {
      subtitulo.textContent = "Escolha um simulado e comece a treinar com tempo real de prova.";
      menuPrincipal.innerHTML = `
        <a href="SelecionarProva.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Fazer uma Prova</strong>
          <span>Simulados com cronômetro e redação</span>
        </a>
        <a href="Historico.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Meu Histórico</strong>
          <span>Veja suas notas e resultados anteriores</span>
        </a>
      `;
    } else {
      menuPrincipal.innerHTML = `
        <a href="Login.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Entrar</strong>
          <span>Já tenho uma conta</span>
        </a>
        <a href="Registro.html" class="menu-card">
          <div class="menu-card-icone"></div>
          <strong>Cadastre-se</strong>
          <span>Sou aluno ou professor e quero começar</span>
        </a>
      `;
    }
  </script>
</body>

</html>
